name: Validate artifacts
on:
  pull_request:
  push:
    branches: [main, initial]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/
      - run: node scripts/validate.js
